<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Profile Finder</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>GitHub Profile Finder</h1>

        <div class="search">
            <input type="text" id="username" placeholder="Enter GitHub Username">

            <button id="btn">
                Search
            </button>
        </div>

        <div class="profile">

            <img id="avatar">

            <h2 id="name"></h2>

            <p id="login"></p>

            <p id="bio"></p>

            <p id="location"></p>

            <div class="stats">

                <div>
                    <h3 id="repos"></h3>
                    <p>Repositories</p>
                </div>

                <div>
                    <h3 id="followers"></h3>
                    <p>Followers</p>
                </div>

                <div>
                    <h3 id="following"></h3>
                    <p>Following</p>
                </div>

            </div>

            <a id="profileLink" target="_blank">
                Visit GitHub
            </a>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
